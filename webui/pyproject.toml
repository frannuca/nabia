# nabia_webui: the web app, the agents and their MCP servers (an independent project; open this
# folder in PyCharm). Every computation goes through the nabia package of ../python, which in turn
# uses the nabia_python_bridge wheel of ../cpp. Set up with scripts/setup_env.sh.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nabia_webui"
version = "0.1.0"
description = "Web app, AI agents and MCP servers for the nabia risk budgeting strategy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nabia[marketdata]>=0.1.0",
    "anthropic[mcp]>=1.13",
    "mcp>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
nabia-web = "nabia_webui.web.__main__:main"
nabia-ai = "nabia_webui.ai.__main__:main"

[tool.setuptools.packages.find]
include = ["nabia_webui*"]

[tool.setuptools.package-data]
"nabia_webui.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
