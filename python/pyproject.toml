# nabia: the Python project (open this folder in PyCharm). Pure Python: the C++ library comes
# from the nabia_python_bridge wheel built by the C++ project (../cpp). Set up the environment
# with scripts/setup_env.sh, which installs that wheel from ../dist and this package in editable mode.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nabia"
version = "0.1.0"
description = "Systematic trend strategy tools on the nabia C++ library: backtests, analytics, market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nabia_python_bridge>=0.1.0", "numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
marketdata = ["sqlalchemy>=2.0", "yfinance>=0.2.40", "ccxt>=4.0"]
postgres = ["psycopg[binary]>=3.1"]
examples = ["matplotlib>=3.7", "yfinance>=0.2"]
test = ["pytest>=7", "sqlalchemy>=2.0"]

[tool.setuptools.packages.find]
include = ["nabia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
