# Builds and tests nabia_python_bridge wheels for CPython 3.10-3.14 on Linux, macOS and Windows
# with cibuildwheel (settings in cpp/pyproject.toml), testing each with nabia_python/tests/bridge. Runs on
# demand, on version tags (v*), and on pull requests that touch the C++ project or the bridge tests.
#
#   wheels          one job per platform; artifact wheels-<os>-<arch>
#   collect         every wheel plus the sdist in one artifact, all-wheels
#   release         on a v* tag: a GitHub Release with all of them attached
#   windows-script  runs cpp/scripts/build_wheels.ps1 and nabia_python/scripts/setup_env.ps1 on Windows
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["cpp/**", "nabia_python/tests/bridge/**", "nabia_python/scripts/**", ".github/workflows/wheels.yml"]

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     archs: x86_64 }
          - { os: ubuntu-24.04-arm, archs: aarch64 }
          - { os: macos-14,         archs: arm64 }
          - { os: macos-14,         archs: x86_64 }   # cross-compiled, tested under Rosetta
          - { os: windows-latest,   archs: AMD64 }    # Windows on Intel/AMD 64-bit (win_amd64)
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v4.3.4
        with:
          package-dir: cpp
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  collect:
    name: all wheels and sdist
    needs: wheels
    if: ${{ !cancelled() }}   # keep the wheels of the platforms that succeeded
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Source distribution
        run: pipx run build --sdist --outdir dist cpp
      - name: List
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: dist/*

  release:
    name: GitHub Release
    needs: collect
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.collect.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: all-wheels
          path: dist
      - name: Create the release with every wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "nabia $GITHUB_REF_NAME" --generate-notes

  windows-script:
    name: Windows build script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cpp/scripts/build_wheels.ps1 (CPython 3.12, tested)
        shell: pwsh
        run: cpp/scripts/build_wheels.ps1 -Versions 3.12 -PythonExe python
      - name: nabia_python/scripts/setup_env.ps1 and the Python project's tests
        shell: pwsh
        run: |
          nabia_python/scripts/setup_env.ps1 -PythonExe python
          nabia_python/.venv/Scripts/python.exe -m pytest -q nabia_python/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
